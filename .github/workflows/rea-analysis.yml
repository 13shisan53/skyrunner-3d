# REA (Reverse Engineer Anything) - CI reverse-engineering scan
# Source: https://github.com/morluto/rea  (MIT)
#
# REA statically analyses the JavaScript application graph of this repo:
# modules, import/export relationships, feature traces and coverage. The
# static JS lane needs no native analysis engine (no Hopper/Ghidra/IDA), so it
# runs fully headless on ubuntu-latest with no licence or API key.
name: REA analysis

on:
  workflow_dispatch:
    inputs:
      target_path:
        description: "Sub-path inside the repo to analyse (default: whole repo)"
        required: false
        default: "."
      upload_evidence:
        description: "Also upload the full Evidence JSON (can be tens of MB)"
        required: false
        default: false
        type: boolean
  pull_request:
    paths:
      - "index.html"
      - "src/**"
      - "vendor/**"
      - "package.json"
      - ".github/workflows/rea-analysis.yml"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "src/**"
      - "vendor/**"
      - "package.json"
      - ".github/workflows/rea-analysis.yml"

permissions:
  contents: read

concurrency:
  group: rea-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pin the REA release so analysis runs are reproducible.
  # Bump deliberately: https://github.com/morluto/rea/releases
  REA_VERSION: "6.7.0"

jobs:
  analyze:
    name: Analyse application graph
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install REA
        run: npm install --global "rea-agents@${REA_VERSION}"

      # `rea doctor` reports on every host prerequisite, including optional
      # native analysis engines. A non-zero exit here means "something is not
      # configured", not "the analysis lane is broken", so it must not fail the
      # job or raise an error annotation.
      - name: Preflight check
        run: |
          code=0
          rea doctor --json > rea-doctor.json || code=$?
          if [ "$code" -ne 0 ]; then
            echo "::notice::rea doctor reported incomplete prerequisites (exit $code). Native analysis engines are not required for the static JavaScript lane."
          fi
          exit 0

      - name: Stage application
        env:
          TARGET_PATH: ${{ inputs.target_path }}
        run: |
          mkdir -p "$RUNNER_TEMP/rea-app" rea-out
          rsync -a --exclude '.git' --exclude 'node_modules' ./ "$RUNNER_TEMP/rea-app/"
          if [ -z "$TARGET_PATH" ] || [ "$TARGET_PATH" = "." ]; then
            TARGET="$RUNNER_TEMP/rea-app"
          else
            TARGET="$RUNNER_TEMP/rea-app/$TARGET_PATH"
          fi
          echo "target=$TARGET" >> "$GITHUB_ENV"
          echo "files=$(find "$TARGET" -type f | wc -l)" >> "$GITHUB_ENV"

      - name: Analyse
        id: analyse
        run: |
          rea analyze "$target" --json > rea-out/evidence.json
          echo "evidence_bytes=$(wc -c < rea-out/evidence.json)" >> "$GITHUB_OUTPUT"

      - name: Project summary
        run: |
          if jq -c '{source: {kind: "inline", evidence: .}, view: {kind: "summary"}}' \
               rea-out/evidence.json > "$RUNNER_TEMP/view-request.json"; then
            if rea inspect-analysis-view "$RUNNER_TEMP/view-request.json" --json > rea-out/summary.json; then
              echo "summary=ok" >> "$GITHUB_ENV"
            else
              echo "summary=projection-failed" >> "$GITHUB_ENV"
              echo "::notice::REA summary projection failed; the raw Evidence is still valid."
            fi
          else
            echo "summary=evidence-not-json" >> "$GITHUB_ENV"
            echo "::notice::REA Evidence was not valid JSON; see the Analyse step log."
          fi
          rm -f "$RUNNER_TEMP/view-request.json"

      - name: Write run summary
        run: |
          {
            echo "## REA analysis"
            echo ""
            echo "| metric | value |"
            echo "| --- | --- |"
            echo "| REA version | ${REA_VERSION} |"
            echo "| analysed target | \`$target\` |"
            echo "| files in target | ${files:-0} |"
            echo "| Evidence bytes | $(wc -c < rea-out/evidence.json 2>/dev/null || echo 0) |"
            echo "| summary projection | ${summary:-unavailable} |"
            echo ""
            if [ -s rea-out/summary.json ]; then
              echo "### Summary"
              echo '```json'
              head -c 20000 rea-out/summary.json
              echo '```'
            else
              echo "_Summary projection unavailable - see the job log and the doctor report artifact._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rea-summary-${{ github.run_number }}
          path: |
            rea-out/summary.json
            rea-doctor.json
          if-no-files-found: warn
          retention-days: 14

      # The full Evidence JSON can be tens of megabytes, so it is uploaded only
      # when explicitly requested. The summary projection is the default output.
      - name: Upload full Evidence
        if: always() && inputs.upload_evidence == true
        uses: actions/upload-artifact@v7
        with:
          name: rea-evidence-${{ github.run_number }}
          path: rea-out/evidence.json
          if-no-files-found: warn
          retention-days: 7
