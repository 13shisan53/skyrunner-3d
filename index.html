<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#0a1020" />
<title>SKYRUNNER — endless 3D platformer</title>
<style>
  :root {
    --ink: #f2f7ff;
    --dim: #9fb2cc;
    --accent: #57e2c8;
    --accent-2: #ffd166;
    --bg: #070b14;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden; overscroll-behavior: none;
    background: var(--bg); color: var(--ink);
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans SC", sans-serif;
    -webkit-font-smoothing: antialiased; user-select: none;
  }
  #game { display: block; width: 100vw; height: 100vh; touch-action: none; }

  .hud {
    position: fixed; inset: 0; pointer-events: none;
    padding: max(16px, env(safe-area-inset-top)) 20px 0;
    display: flex; justify-content: space-between; align-items: flex-start;
    font-variant-numeric: tabular-nums;
  }
  .panel {
    background: rgba(9, 16, 30, .5);
    border: 1px solid rgba(120, 190, 240, .18);
    border-radius: 14px;
    padding: 10px 16px;
    backdrop-filter: blur(12px);
  }
  .label { font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--dim); }
  .value { font-size: 30px; font-weight: 800; letter-spacing: -.02em; line-height: 1.05; }
  .sub { font-size: 12px; color: var(--dim); margin-top: 2px; }
  .sub b { color: var(--accent-2); font-weight: 650; }

  #mute {
    pointer-events: auto; width: 44px; height: 44px; border-radius: 12px;
    background: rgba(9, 16, 30, .5); border: 1px solid rgba(120, 190, 240, .18);
    color: var(--ink); font-size: 18px; cursor: pointer; backdrop-filter: blur(12px);
  }
  #mute.off { color: #6d7f99; }

  .overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px;
    background: radial-gradient(ellipse at 50% 38%, rgba(16, 30, 54, .7), rgba(3, 6, 12, .94));
    backdrop-filter: blur(7px); z-index: 10; text-align: center;
    padding: 24px max(24px, env(safe-area-inset-left));
  }
  .overlay.hidden { display: none; }
  h1 {
    margin: 0; font-size: clamp(40px, 9vw, 96px); line-height: .9;
    letter-spacing: -.035em; font-weight: 850;
    background: linear-gradient(180deg, #ffffff 0%, #9be9ff 52%, #45b6e0 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 26px rgba(90, 210, 255, .38));
  }
  .tag { font-size: 11px; letter-spacing: .34em; text-transform: uppercase; color: var(--accent); }
  .sub2 { color: var(--dim); font-size: 14px; max-width: 520px; line-height: 1.7; margin: 0; }
  .keys { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  kbd {
    font: inherit; font-size: 12px; padding: 6px 10px; border-radius: 8px;
    background: rgba(140, 190, 240, .1); border: 1px solid rgba(140, 190, 240, .22);
    color: #d6eaff;
  }
  button.primary {
    pointer-events: auto; cursor: pointer; font: inherit; font-weight: 750;
    font-size: 15px; letter-spacing: .1em; text-transform: uppercase;
    padding: 15px 38px; border-radius: 999px; border: 0;
    color: #03171a; background: linear-gradient(180deg, #8dfff0, #2fc9c9);
    box-shadow: 0 12px 44px rgba(47, 201, 201, .38), inset 0 1px 0 rgba(255,255,255,.6);
    transition: transform .12s ease;
  }
  button.primary:active { transform: scale(.97); }

  .best { font-size: 13px; color: var(--dim); letter-spacing: .05em; }
  .best b { color: var(--accent-2); font-size: 18px; }

  /* ---- touch controls ---- */
  .touch-ui { display: none; }
  body.touch .touch-ui { display: block; }
  .stick {
    position: fixed; left: max(20px, env(safe-area-inset-left)); bottom: max(24px, env(safe-area-inset-bottom));
    width: 132px; height: 132px; border-radius: 50%;
    background: rgba(10, 20, 36, .34); border: 1.5px solid rgba(130, 200, 240, .22);
    touch-action: none; z-index: 5;
  }
  .knob {
    position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px;
    border-radius: 50%; background: radial-gradient(circle at 35% 30%, #d5fbff, #3fc9d6 70%);
    box-shadow: 0 6px 18px rgba(0, 0, 0, .4); opacity: .92;
  }
  .jump {
    position: fixed; right: max(20px, env(safe-area-inset-right)); bottom: max(30px, env(safe-area-inset-bottom));
    width: 96px; height: 96px; border-radius: 50%;
    display: grid; place-items: center;
    font-size: 12px; font-weight: 800; letter-spacing: .12em; color: #04222a;
    background: radial-gradient(circle at 38% 32%, #b7fff4, #35c9c3 72%);
    box-shadow: 0 10px 30px rgba(53, 201, 195, .35);
    touch-action: none; z-index: 5;
  }
  .jump.down { transform: scale(.93); filter: brightness(1.15); }

  #err {
    position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 99;
    display: none; padding: 10px 14px; border-radius: 10px;
    background: rgba(60, 8, 12, .94); border: 1px solid #ff5d6c; color: #ffd9dd;
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    white-space: pre-wrap; max-height: 40vh; overflow: auto;
  }
  #err.show { display: block; }
  .fps { position: fixed; right: 12px; bottom: 12px; font: 11px ui-monospace, monospace; color: rgba(150,180,215,.45); pointer-events: none; }
  body.touch .fps { display: none; }
</style>
<script>
  window.__fatal = null;
  function showFatal(msg) {
    window.__fatal = msg;
    var el = document.getElementById('err');
    if (el) { el.textContent = String(msg); el.classList.add('show'); }
    document.title = 'ERR: ' + String(msg).slice(0, 120);
  }
  window.addEventListener('error', function (e) {
    showFatal((e.message || 'script error') + (e.filename ? ' @ ' + e.filename + ':' + e.lineno : ''));
  });
  window.addEventListener('unhandledrejection', function (e) {
    showFatal('unhandled rejection: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
  });
  if (('ontouchstart' in window) || (window.matchMedia && matchMedia('(pointer: coarse)').matches)) {
    document.documentElement.classList.add('touch-device');
  }
</script>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/addons/"
  }
}
</script>
</head>
<body>
<canvas id="game"></canvas>

<div class="hud">
  <div class="panel">
    <div class="label">Score</div>
    <div class="value" id="score">0</div>
    <div class="sub"><b id="coins">0</b> coins · <span id="dist">0</span>m</div>
  </div>
  <button id="mute" title="mute">♪</button>
</div>

<div id="touch" class="touch-ui">
  <div id="stick" class="stick"><div id="knob" class="knob"></div></div>
  <div id="jump" class="jump">JUMP</div>
</div>

<div class="overlay" id="start">
  <div class="tag">endless 3D platformer</div>
  <h1>SKYRUNNER</h1>
  <p class="sub2">踩着彩色浮空平台一路向前，收集金币、踩扁巡逻无人机。掉下去就结束——看你能跑多远。</p>
  <div class="keys">
    <kbd>WASD / 方向键</kbd><kbd>空格 跳</kbd><kbd>拖拽 转视角</kbd><kbd>Shift 冲刺</kbd>
  </div>
  <div class="best">最高分 <b id="bestStart">0</b></div>
  <button class="primary" id="play">开始</button>
</div>

<div class="overlay hidden" id="over">
  <div class="tag" id="overTag">game over</div>
  <h1 id="overTitle">结束</h1>
  <p class="sub2" id="overStats"></p>
  <div class="best">最高分 <b id="bestOver">0</b></div>
  <button class="primary" id="again">再来一次</button>
</div>

<div class="fps" id="fps"></div>
<div id="err"></div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
